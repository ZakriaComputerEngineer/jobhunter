<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobHunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>J</text></svg>">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">J</div><div>JobHunter<small>AI · ML · Automation radar</small></div></div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-v="dashboard">◫ Dashboard</a>
      <a href="#/jobs" data-v="jobs">⌕ Jobs <span class="ct" id="ctJobs">–</span></a>
      <a href="#/domains" data-v="domains">◈ Domains</a>
      <a href="#/pipeline" data-v="pipeline">▤ Pipeline</a>
      <a href="#/apply" data-v="apply">⚡ Apply <span class="ct" id="ctApply" hidden>!</span></a>
      <div class="sec">Resume</div>
      <a href="#/resumes" data-v="resumes">▣ Resumes <span class="ct" id="ctRes">–</span></a>
      <a href="#/ats" data-v="ats">◎ ATS Lab</a>
      <div class="sec">System</div>
      <a href="#/scraper" data-v="scraper">↻ Scraper</a>
      <a href="#/settings" data-v="settings">⚙ Settings</a>
    </nav>
    <div class="foot">
      <div class="row"><span class="dot" id="scrapeDot"></span><span id="scrapeTxt">Idle</span></div>
      <div class="dim small" id="nextRun" style="margin-top:4px"></div>
    </div>
  </aside>
  <section class="main">
    <div class="top">
      <h1 id="title">Dashboard</h1>
      <div class="sp"></div>
      <div class="search"><span>⌕</span><input id="gq" placeholder="Search jobs, companies, skills…"><span class="kbd">Ctrl K</span></div>
      <button class="btn" id="btnAdd" title="Add a job by pasting its description">＋ Add job</button>
      <button class="btn pri" id="btnScrape">↻ Scrape now</button>
      <button class="btn icon ghost" id="btnTheme" title="Toggle theme">◐</button>
    </div>
    <div id="applyBar"></div>
    <div class="content" id="view"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="/web/app.js"></script>
</body>
</html>
